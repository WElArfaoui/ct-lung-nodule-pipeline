name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-import:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check src

      - name: Import smoke test
        run: |
          python -c "import lung_nodule_pipeline; print(lung_nodule_pipeline.__version__)"
          python -m lung_nodule_pipeline.analyze_nodules    --help
          python -m lung_nodule_pipeline.select_thin_recon  --help
          python -m lung_nodule_pipeline.print_report       --help
          python -m lung_nodule_pipeline.compute_diameters  --help
          python -m lung_nodule_pipeline.final_summary      --help
